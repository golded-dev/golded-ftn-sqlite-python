[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "golded-ftn-sqlite"
version = "1.1.0"
description = "Transactional SQLite message bases for FTN netmail and echomail"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GoldED.dev contributors"}]
dependencies = ["golded-ftn>=1.5.0,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/golded-dev/golded-ftn-sqlite-python"
Issues = "https://github.com/golded-dev/golded-ftn-sqlite-python/issues"
Changelog = "https://github.com/golded-dev/golded-ftn-sqlite-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.26",
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.11",
    "twine>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/golded_ftn_sqlite"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "CONTEXT.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
